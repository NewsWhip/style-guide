<h2 class="page-header">Picker / Searchable dropdown</h2>

<p>
    A searchable dropdown component that supports single and multi-select modes with hierarchical data and custom
    placeholder text.
</p>

<h3>Importing</h3>
<app-code [snippet]="importSnippet"></app-code>

<div class="row">
    <div class="col-md-6">
        <h3>Single Select</h3>

        <app-code-sandbox [snippet]="singleSelectSnippet">
            <label style="margin-bottom: 8px; display: block">Single select picker</label>
            <nw-angular-picker
                #singlePicker
                [items]="foods"
                [placeholderText]="getFoodPlaceholder()"
                [isMultiSelect]="false"
                [shouldShowSelections]="false"
                inputPlaceholderText="Single select picker">
            </nw-angular-picker>
        </app-code-sandbox>
    </div>

    <div class="col-md-6">
        <h3>Multi Select</h3>

        <app-code-sandbox [snippet]="multiSelectSnippet">
            <label style="margin-bottom: 8px; display: block">Multi select picker with custom placeholder text</label>
            <nw-angular-picker
                #picker
                [items]="countries"
                [placeholderText]="getCountryPlaceholder()"
                inputPlaceholderText="Custom input placeholder text">
                <div class="text-right results-footer">
                    <button
                        class="btn btn-primary"
                        (click)="picker.closeResults()"
                        tabindex="0"
                        role="button">
                        Done
                    </button>
                </div>
            </nw-angular-picker>
        </app-code-sandbox>
    </div>
</div>
